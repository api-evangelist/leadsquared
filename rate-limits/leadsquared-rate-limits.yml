scope_model: per-account (subscription plan), with a per-user daily allowance added on top
headers_documented: false
headers_note: >-
  LeadSquared documents NO rate-limit response headers — there is no
  X-RateLimit-*, RateLimit-* or Retry-After in the documentation — and does not
  state the HTTP status returned on exhaustion. The docs say only to "implement
  retry logic after receiving rate limit exceptions". An agent therefore cannot
  read remaining quota from a response; it can only fail and back off. This is the
  single biggest runtime-semantics gap in the LeadSquared API surface.
exhaustion_status: null
retry_after: null
