mitigations:
  - >-
    The Async API (https://apidocs.leadsquared.com/async-api/) is documented as the
    way to avoid rate-limit impact on end users: it queues and retries up to 10
    times and returns a RequestId to poll, so a web form submission is not blocked
    by the 5-second throttle.
