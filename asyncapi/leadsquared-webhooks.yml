asyncapi: false
asyncapi_note: >-
  LeadSquared publishes NO AsyncAPI document. Do not confuse the LeadSquared
  "Async API" (https://apidocs.leadsquared.com/async-api/) with the AsyncAPI
  specification — the former is a queued, retrying REST surface on
  asyncapi.leadsquared.com that returns a RequestId to poll, not an event-driven
  contract. The real event surface is webhooks, catalogued below.
docs:
  webhooks: https://apidocs.leadsquared.com/webhooks/
  best_practices: https://apidocs.leadsquared.com/webhook-best-practices/
  management_api: https://apidocs.leadsquared.com/webhook-apis/
transport:
  method: POST
  content_types:
    - application/json
    - application/x-www-form-urlencoded
    - text/plain
  default_content_type: application/json
  query_parameters:
    - name: entityType
      description: webhook | rule | automation — what configured the delivery.
    - name: entityId
      description: Identifier of the triggering entity.
    - name: eventType
      description: Action descriptor, e.g. "SalesActivity_Post_Update".
  custom_headers: supported
  signing: none
  signing_note: >-
    No HMAC signature or shared-secret verification is documented. Authenticity is
    left to customer-configured custom headers, which is a weaker guarantee than a
    signed payload — a consumer cannot verify the payload was not tampered with.
  retries:
    attempts: 3
    note: Failed executions retry up to 3 attempts before being marked failed.
  statuses: [Success (HTTP 200), Failure (non-200), In Queue]
  batching: >-
    Activity data for activities that happened within one minute is grouped and
    posted together, so a handler must accept either a single or multiple activity
    ids per request.
plan_limits:
