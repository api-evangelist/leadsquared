note: >-
  LeadSquared ships NO conventional first-party REST client SDK on any package
  registry. What it does publish is `lslapp`, the first-party CLI/scaffold for
  building LeadSquared Apps (Lapps), maintained from @leadsquared.com accounts,
  plus four sample-code repositories in the LeadSquared GitHub organization. The
  most useful currency finding here is decay: the newest first-party artifact of
  any kind is `lslapp` 1.2.2 from 2022-03-02, and the PHP client library in the
  GitHub org has not been pushed since 2016-06-28, while the REST API itself has
  continued to ship (Async API, Service CRM, Portals).
