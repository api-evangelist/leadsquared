note: >-
  The entity graph below is derived from the two OpenAPI files in this repo plus the
  operation surface LeadSquared documents (lead-management, activity-management,
  opportunity-management, task-management, user-management, account-company-
  management, service-crm, list-management, object-types). Field-level detail is thin
  because the harvested OpenAPI covers only 4 of ~381 documented operations; every
  relationship recorded here is backed by a named documented operation, none is
  inferred from naming alone.
identifiers:
  style: guid
  note: >-
    Primary keys are GUIDs (e.g. ProspectID "cc3fef18-960b-4a60-98c0-af2ab61cee80").
    There is no Stripe-style typed id prefix, so an id alone does not tell an agent
    what entity it belongs to. Leads additionally carry a numeric ProspectAutoId used
    for sorting.
attribute_model:
  style: attribute-value-list
  note: >-
    Leads and activities are transported as arrays of {Attribute, Value} pairs rather
    than as typed JSON objects — createLead takes an array of LeadAttribute, and bulk
    reads return LeadPropertyList entries of {Attribute, Value, Fields}. Schemas are
    tenant-defined (custom lead fields, custom activity types), so the shape must be
    discovered at runtime via the metadata operations rather than read from a spec.
  metadata_operations:
    - https://apidocs.leadsquared.com/meta-data/
    - https://apidocs.leadsquared.com/get-lead-field-properties/
    - https://apidocs.leadsquared.com/get-details-of-activity-type/
    - https://apidocs.leadsquared.com/get-metadata-of-an-opportunity-type/
    - https://apidocs.leadsquared.com/get-ticket-fields/
