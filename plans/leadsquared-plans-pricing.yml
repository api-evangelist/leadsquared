note: >-
  LeadSquared publishes list prices for two product lines. Sales CRM is priced per
  user per month billed annually; Marketing Automation is priced per account billed
  annually. Neither pricing page states an API call allowance — the API quota
  attaches to the Pro/Super tier names and is published separately at
  https://apidocs.leadsquared.com/rate-limits/, which is why the two artifacts must
  be read together. Service CRM, Field Sales and the industry editions are quoted
  by sales and are not listed here.
