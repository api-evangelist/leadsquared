aid: leadsquared
name: LeadSquared
description: >-
  LeadSquared is a marketing automation and CRM platform that helps businesses
  capture, manage, nurture, and convert leads across sales, marketing, and
  service workflows. It offers Sales CRM, Service CRM, marketing automation,
  field force automation, and a no-code/low-code platform for building
  industry-specific customer experiences. The LeadSquared REST API provides
  access to core platform resources like leads, opportunities, activities,
  tasks, and users using API key authentication.
