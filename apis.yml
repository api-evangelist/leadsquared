apis:
- aid: leadsquared:rest-api
  name: LeadSquared REST API
  description: >-
    REST API for managing leads, opportunities, activities, tasks, users, campaigns, and other CRM resources
    in LeadSquared. Includes Sales CRM, Service CRM, Async, and Portal APIs along with Lapps, Batch Jobs,
    Webhooks, and Mavis Database developer tools. Authentication uses AccessKey and SecretKey query parameters
    or headers tied to a region- specific API host.
  humanURL: https://apidocs.leadsquared.com/overview/
  baseURL: https://api.leadsquared.com
  tags:
  - CRM
  - Marketing Automation
  - Lead Management
  - Sales CRM
  - Service CRM
  properties:
  - type: Documentation
    url: https://apidocs.leadsquared.com/overview/
  - type: Authentication
    url: https://apidocs.leadsquared.com/authentication/
  - type: API Host
    url: https://apidocs.leadsquared.com/api-host/
  - type: PostmanCollection
    url: https://apidocs.leadsquared.com/leadsquared-run-in-postman/
- aid: leadsquared:async-api
  name: LeadSquared Async API
  description: >-
    Queued, retrying variants of the highest-volume LeadSquared write operations —
    Capture Leads, Update a Lead, Post an Activity on a Lead, Create a Lead and
    Activity, Capture Opportunities, Update an Opportunity and Post a Call Log. A
    submission returns a RequestId which is then polled on a matching status
    endpoint, with a metrics endpoint per operation. Requests are accepted and
    retried up to 10 times even while the core platform is unavailable, which is the
    documented way to keep user-facing capture paths off the 5-second throttle.
    Authentication adds an x-api-key header to the accessKey/secretKey pair; the
    status endpoints need only x-api-key. Hosts are regional, mirroring the REST API.
  humanURL: https://apidocs.leadsquared.com/async-api/
  baseURL: https://asyncapi.leadsquared.com
  tags:
  - Async
  - Lead Management
  - Queueing
  properties:
  - type: Documentation
    url: https://apidocs.leadsquared.com/async-api/
  - type: Authentication
    url: authentication/leadsquared-authentication.yml
