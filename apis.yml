apis:
  - aid: leadsquared:rest-api
    name: LeadSquared REST API
    description: >-
      REST API for managing leads, opportunities, activities, tasks, users,
      campaigns, and other CRM resources in LeadSquared. Includes Sales CRM,
      Service CRM, Async, and Portal APIs along with Lapps, Batch Jobs,
      Webhooks, and Mavis Database developer tools. Authentication uses
      AccessKey and SecretKey query parameters or headers tied to a region-
      specific API host.
    humanURL: https://apidocs.leadsquared.com/overview/
