note: >-
  LeadSquared does not use RFC 9457 problem+json. Failures return HTTP status plus
  a three-field JSON envelope. The machine-actionable part is `ExceptionType` — a
  .NET-style exception class name prefixed `MX` — but LeadSquared publishes NO
  enumerated registry of those exception types; the documentation shows exactly one
  by example. An agent can branch on the HTTP status and on the presence of
  `Status == "Error"`, but cannot enumerate or pre-handle the exception space.
